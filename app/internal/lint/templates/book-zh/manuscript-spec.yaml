# 书籍编校撰写规范（医学书稿编校细则 yueshu.md）— 注释供 AI 直接读取，修改阈值后无需额外操作。
# AI 必读：本文档是撰写规定的单一事实源，所有阈值以此处为准。
#
# 撰写硬性规定（事前指导）：
# - 全文中文撰写；英文仅限专业术语首次括注（全称小写 + 缩略语大写，如 "腹腔间室综合征(abdominal compartment syndrome，ACS)"）
# - 标题结构：首个标题为书名（不编号）；章节采用中文编号体系（# 第一章、## 第一节、### 一、#### （一）），
#   禁用 1.1.1 国际点分编号；1～5 级标题一般不标注英文
# - 数字：一律阿拉伯数字；范围用波浪线（10%～16%），年份范围用一字线（1988—1998年）；
#   百分号只在范围末（50%～80%，不用 50～80%）
# - 单位：除时间单位（5～8天、6小时）外一律用符号（mg、cm），禁用中文单位词（毫克、厘米）与英制单位（磅、英寸）
# - 图表按章编序（图 1-1、表 5-1），先引见后出现；表用三横线表
# - 正文禁止：列表、加粗、AI 痕迹词（"首次证实""颠覆性"）

paper_type: book
lang: zh
journal: ""
sections: []            # 书籍按"章"成册，章节完整性（R1.5）不启用
word_counts:
  total: [500, 20000]   # 单章文件总字数 [最小, 最大]
  abstract: [200, 500]  # 摘要字数（书籍通常无摘要标题，规则不触发）
  paragraph: [50, 2000] # 段落字数 [最小, 最大]
citation:
  count: [10, 200]      # 单章引用篇数 [最小, 最大]
  style: gbt7714        # 引用格式：gbt7714 | apa | ieee
heading:
  max_level: 7          # 标题最大层级（yueshu.md 七级标题体系）
  max_length: 20        # 标题最大字数（末尾无标点）
  require_numbering: true # 标题必须带中文编号（第一篇/第一章/一、/（一）/1./（1））
book_top_level: auto    # 文件顶层标题级别：auto（默认，整本/单章/单节文件均兼容）| book（整本书单文件，首标题须为书名）| chapter（一章一文件）| section（一节一文件）
skip_rules: []          # 永久跳过的规则 ID（等效每次 verify --skip，如 [R3.4, R8.1]）；空=全部启用
boast_words:
  - 首次证实
  - 颠覆性
  - 革命性
  - 绝无仅有
  - 前所未有
  - 极其创新
