# Qualitative manuscript spec — comments are AI-readable; no extra step after editing thresholds.
# AI must-read: This file is the single source of truth for writing rules.
# Narrative skeleton and section-by-section guidance: manuscript-format skill references/qualitative.md.
#
# Writing rules (pre-instruction):
# - Write in academic English; define abbreviations at first use
# - Headings are usually unnumbered (require_numbering: false); first heading is the paper title
# - No lists or bold in body text; no back-references or self-promotion
# - Results present themes and quotations only: no literature comparison, no new concept definitions
# - Tag every quotation with role + ID (e.g. P-12, F-03, N-02); keep prefixes consistent throughout

paper_type: qualitative
lang: en
journal: ""
sections:
  - Introduction
  - Methods
  - Results
  - Discussion
  - Conclusion
word_counts:
  total: [5000, 9000]       # Total word count [min, max] (qualitative papers run longer than four-section empirical)
  abstract: [250, 350]      # Abstract word count [min, max]
  paragraph: [80, 300]      # Per-paragraph word count [min, max]
citation:
  count: [30, 70]           # Total citation count [min, max]
  style: apa                # Citation style: gb7714-2025 | apa | ieee
  run_limit: 3              # Max consecutive citations (R5.3): run_limit+1 in a row is a violation; 0=default 3
  max_age_years: 10         # R5.8 Citation currency (hard): flag refs older than this many years, per-item; 0=default 10
  warn_age_years: 5         # R5.8 Citation currency (soft): aggregate warn counts older than this; 0=default 5
  self_citation_authors: [] # R5.9 Self-citation: author's own family names (e.g. [Smith]); empty=disabled
  self_citation_max_ratio: 0.15  # R5.9 Max self-citation ratio; 0=default 0.15
heading:
  max_level: 4              # Max heading level
  max_length: 15            # Max heading length (no trailing punctuation)
  require_numbering: false  # Qualitative manuscripts usually use unnumbered headings
style_exempt_terms:         # R4.5 blacklist exemptions (disciplinary terms/collocations); empty=no exemptions
  # - robust estimator
forbidden_terms:            # R7.3 custom forbidden terms in body text (phrase or a single character/symbol); each may carry a custom note
  # - term: Ⓡ
  #   note: Avoid the registered-trademark symbol
repeat_min_len: 10          # R4.10 Min length of a repeated fragment (>=2 occurrences flagged as redundancy); 0=default 10
boast_words:                # Note: "it is worth noting" is recommended for divergence marking, so it is not listed here
  - revolutionary
  - groundbreaking
  - unprecedented
  - paradigm
  - synergy
  - empower
  - unleash
  - catalyze
  - harness
  - delve
  - tapestry
  - landscape
  - cornerstone
  - seamlessly
  - robust
  - comprehensive
  - crucial
  - indispensable
  - intricate
  - meticulous
  - profound
  - significant
  - outstanding
  - extraordinary
  - unparalleled
  - needless to say
  - in conclusion
  - ever-evolving
  - vibrant
  - lay the foundation
  - lays the foundation
  - laid the foundation
  - breakthrough
