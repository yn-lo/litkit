# Empirical manuscript spec — comments are AI-readable; no extra step after editing thresholds.
# AI must-read: This file is the single source of truth for writing rules.
#
# Writing rules (pre-instruction):
# - Write in academic English; define abbreviations at first use
# - Heading structure: first heading is the paper title (unnumbered); chapters numbered from 1, aligned with # level (# 1, ## 1.1, ### 1.1.1)
# - No lists or bold in body text; no back-references or self-promotion
# - Report statistics with consistent decimals; percentages rounded to 1 decimal

paper_type: empirical
lang: en
journal: ""
sections:
  - Introduction
  - Methods
  - Results
  - Discussion
  - Conclusion
word_counts:
  total: [3500, 6000]       # Total word count [min, max]
  abstract: [200, 500]      # Abstract word count [min, max]
  paragraph: [200, 400]     # Per-paragraph word count [min, max]
citation:
  count: [20, 40]           # Total citation count [min, max]
  style: apa                # Citation style: gbt7714 | apa | ieee
  run_limit: 3              # Max consecutive citations (R5.3): run_limit+1 in a row is a violation; 0=default 3
heading:
  max_level: 4              # Max heading level
  max_length: 15            # Max heading length (no trailing punctuation)
  require_numbering: true   # Headings must carry numeric numbers (1 / 1.1 / 1.1.1, aligned with markdown level)
