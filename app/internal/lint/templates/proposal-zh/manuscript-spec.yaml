# 学术标书（课题申请书）撰写规范 — 注释供 AI 直接读取，修改阈值后无需额外操作。
# AI 必读：本文档是撰写规定的单一事实源，所有阈值以此处为准。
#
# 撰写硬性规定（事前指导）：
# - 全文中文撰写；英文仅限专业术语首次括注
# - 引用模式 endnote：报告正文不出现任何内联引用标记（[1] / [1,2] / （作者，年份））；
#   参考文献统一编号列于报告正文末尾（主要参考文献目录），条目编号连续
# - 封面、简表、经费预算表、签章页不属于报告正文，不参与字数统计
# - 待填空项用〔　〕占位（如批件号、签字），AI 禁止编造空项内容
# - 章节结构按申报单位模板；字数区间逐节校验（见 sections 注释）

paper_type: proposal
lang: zh
journal: ""
citation_mode: endnote        # 标书引用模式：正文不内联引用，参考文献置于报告正文末尾
sections:
  - 中文摘要                  # ≤400 字
  - 立项依据                  # 4000—8000 字（含研究内容/目标/方案/创新点/年度计划）
  - 研究基础                  # 工作基础与工作条件
  - 经费预算
word_counts:
  total: [5000, 12000]        # 报告正文总字数（不含封面/简表/表格）
  abstract: [200, 400]        # 中文摘要（多数院内课题限 400 字）
  paragraph: [80, 500]        # 标书段落普遍长于论文，放宽上限
citation:
  count: [10, 40]             # 主要参考文献篇数
  style: gbt7714
  run_limit: 0                # endnote 模式无内联引用连串问题
heading:
  max_level: 3
  max_length: 30              # 标书标题普遍长于论文（如"拟解决的关键科学问题"）
  require_numbering: false    # 标书标题多用"（一）（二）/1.2"混合编号，不强制纯数字编号
boast_words:
  - 首次证实
  - 颠覆性
  - 革命性
  - 绝无仅有
  - 前所未有
  - 极其创新
  - 突破性
  - 完美解决
  - 彻底解决
  - 完全解决
  - 史无前例
  - 划时代
  - 里程碑式
  - 改写
  - 重塑
  - 无与伦比
  - 毋庸置疑
  - 不言而喻
