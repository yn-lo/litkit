# 质性研究撰写规范 — 注释供 AI 直接读取，修改阈值后无需额外操作。
# AI 必读：本文档是撰写规定的单一事实源，所有阈值以此处为准。
# 叙事骨架与逐节写法见 manuscript-format 技能 references/qualitative.md（问答体）。
#
# 撰写硬性规定（事前指导）：
# - 全文中文撰写；英文仅限专业术语首次括注
# - 标题结构：首个标题为论文大标题（不编号）；章节从 1 开始编号，编号与 # 层级对齐（# 1、## 1.1、### 1.1.1）
# - 正文禁止：列表、加粗、回引（如"见本文2.3节"）、AI 痕迹词（"首次证实""颠覆性"）
# - 结果只呈现主题与引语，不写文献比较、不写新概念定义；样本描述可用 n/%，主题不得做频次或百分比
# - 引语末尾统一标注角色＋编号（如 P-12、F-03、N-02），全文前缀不混用

paper_type: qualitative
lang: zh
journal: ""
sections:
  - 引言
  - 方法
  - 结果
  - 讨论
  - 结论
word_counts:
  total: [6000, 12000]      # 全文总字数 [最小, 最大]（质性论文引语多，篇幅大于四段式实证）
  abstract: [450, 600]      # 摘要字数 [最小, 最大]（质性论文摘要按四/五段展开，目标刊另有要求从其规定）
  paragraph: [100, 450]     # 段落字数 [最小, 最大]
citation:
  count: [30, 60]           # 全文引用篇数 [最小, 最大]
  style: gb7714-2025            # 引用格式：gb7714-2025 | apa | ieee（影响引用格式默认值）
  run_limit: 3              # 连续引用聚集上限（R5.3）：连续 run_limit+1 个引用连串违规；0=默认 3
  max_age_years: 10         # R5.8 引用时效硬档：文献年份距今超过该值提示（逐篇）；0=默认 10
  warn_age_years: 5         # R5.8 引用时效软档：距今超过该值的篇数作两档汇总提示；0=默认 5
  self_citation_authors: [] # R5.9 自引检查：作者本人署名（如 [Smith]），空=不启用
  self_citation_max_ratio: 0.15  # R5.9 自引比例上限；0=默认 0.15
heading:
  max_level: 4              # 标题最大层级
  max_length: 15            # 标题最大字数（末尾无标点）
  require_numbering: true   # 标题必须带数字编号（1 / 1.1 / 1.1.1，与 markdown 层级对齐）
style_exempt_terms:         # R4.5 术语黑名单豁免词（学科术语/固定搭配），空=不豁免
  # - 稳健估计
forbidden_terms:            # R7.3 自定义正文禁用字词（词组或单个符号），逐条可带自定义违规提示 note
  # - term: Ⓡ
  #   note: 禁用注册商标符号
repeat_min_len: 10          # R4.10 重复句段检测最小长度：连续片段≥该值且出现≥2 次报潜在冗余；0=默认 10
boast_words:                # 注意：质性规范推荐用"值得注意的是"标示组间分歧，故本表不含该词
  - 首次证实
  - 颠覆性
  - 革命性
  - 绝无仅有
  - 前所未有
  - 极其创新
  - 突破性
