# GitHub Actions CI — litkit
#
# 门禁分层（P0/P1/P2，按 harness.md 4.6 节）：
#   P0 架构不变量 / 测试质量 / 静态分析（lint）
#   P1 安全（govulncheck）/ 格式化强制
#   P2 文档腐化 / 文档断链
#
# 实际部署：复制本文件到 .github/workflows/ci.yml
# Go 源码位于 app/ 子目录，Go 工具链命令在 app/ 执行；架构约束在仓库根执行。

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: Lint (gofmt + golangci-lint + go vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: app/go.sum

      - name: Format check (gofmt)
        working-directory: app
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::未格式化文件: $unformatted"
            exit 1
          fi

      - name: Lint
        working-directory: app
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./... --config ../.harness/constraints/style/.golangci.yml

      - name: Vet
        working-directory: app
        run: go vet ./...

  test:
    name: Test (unit + coverage + arch-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: app/go.sum

      - name: Unit tests (offline hermetic)
        working-directory: app
        run: go test ./...

      - name: Coverage gate (>= 60%)
        working-directory: app
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: Architecture check (layer direction)
        run: |
          cd .harness/constraints/arch
          go run .

      - name: Interface consistency (CLI vs api.md)
        run: |
          cd .harness/constraints/sync
          go run .

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: app/go.sum

      - name: Dependency vulnerability scan
        working-directory: app
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docs:
    name: Docs freshness + broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Specs docs freshness (< 60 days)
        run: |
          STALE_DAYS=60
          stale=0
          while read -r f; do
            echo "::warning file=$f::规格文档超过 $STALE_DAYS 天未更新，可能已与实现脱节"
            stale=1
          done < <(find .harness/specs -name "*.md" -mtime +$STALE_DAYS)
          exit $stale

      - name: Broken link check (CLAUDE.md + .harness, NFR-MAINT-04)
        run: |
          cd .harness/constraints/sync
          go run .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: app/go.sum

      - name: Build
        working-directory: app
        run: go build ./cmd/litkit
