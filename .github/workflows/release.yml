# GitHub Actions Release — litkit
#
# 打 tag（如 v0.1.0）时触发：用 goreleaser 构建跨平台二进制（含 Windows .exe），
# 上传到 GitHub Release 页面。按 app/.goreleaser.yml 产出，release 默认 draft。
#
# 用法：git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: app/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          workdir: app
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installer:
    name: Build & upload Windows installer
    needs: goreleaser
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: app/go.sum

      - name: Build Windows binaries
        working-directory: app
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $ld = "-s -w -X litkit/internal/buildinfo.Version=$v"
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags $ld -o dist/litkit-amd64.exe ./cmd/litkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GOARCH = "arm64"
          go build -trimpath -ldflags $ld -o dist/litkit-arm64.exe ./cmd/litkit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installers
        working-directory: app
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "installer\litkit.iss" "/DAppVersion=$v" "/DAppArch=amd64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $iscc "installer\litkit.iss" "/DAppVersion=$v" "/DAppArch=arm64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installers to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Get-ChildItem "app\dist\litkit-*-setup.exe" | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --clobber
          }